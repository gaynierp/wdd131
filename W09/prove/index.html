<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Open Graph (Facebook, LinkedIn, etc.) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Your Title" />
    <meta property="og:description" content="Your Description" />
    <meta property="og:url" content="Your URL" />
    <meta property="og:image" content="social-preview-image.png" />

    <!-- X Card -->
    <meta name="twitter:card" content="Social Preview Image" />
    <meta name="twitter:title" content="Your Title" />
    <meta name="twitter:description" content="Your Description" />
    <meta name="twitter:image" content="social-preview-image.png" />

    <!-- One favicon (ICO works everywhere) -->
    <link rel="icon" href="favicon.ico" />

    <!-- One Apple Touch Icon (iOS home screen) -->
    <link rel="apple-touch-icon" href="images/apple-touch-icon.png" />
    <link rel="stylesheet" href="styles.css" />

    <title>Document</title>
  </head>
  <body>
    <div class="recIcon">
      <img src="images/recipe-book.png" alt="recipe book image" />
      <h1>Recipe Book</h1>
    </div>
    <div class="search">
      <form>
        <label for="search">Search</label>
        <input type="text" />
        <img
          src="https://wddbyui.github.io/wdd131/images/recipe1/search.svg"
          alt="search magnifying glass"
        />
      </form>
    </div>
    <div class="mainImg">
      <img src="images/apple-crisp.jpg" alt="Applecrisp" />
      <div class="recipeInfo">
        <h2>Apple Crisp</h2>
        <span class="rating" role="img" aria-label="Rating: 4 out of 5 stars">
          <span aria-hidden="true" class="icon-star">⭐</span>
          <span aria-hidden="true" class="icon-star">⭐</span>
          <span aria-hidden="true" class="icon-star">⭐</span>
          <span aria-hidden="true" class="icon-star">⭐</span>
          <span aria-hidden="true" class="icon-star-empty">☆</span>
        </span>
        <p>This apple crisp is a simple yet delicious desert</p>
      </div>
    </div>
    <div class="social">
      <!-- Social media icons provided under CC from https://www.iconfinder.com/AlfredoCreates  -->
      <img
        src="https://wddbyui.github.io/wdd131/images/recipe1/instagram_icon.svg"
        alt="instagram icon"
      /><img
        src="https://wddbyui.github.io/wdd131/images/recipe1/youtube_icon.svg"
        alt="youtube icon"
      /><img
        src="https://wddbyui.github.io/wdd131/images/recipe1/pinterest_icon.svg"
        alt="pinterest icon"
      />
    </div>

    <footer>
      <a href="https://www.flaticon.com/free-icons/recipe" title="recipe icons"
        >Recipe icons created by Freepik - Flaticon</a
      >
    </footer>
  </body>
</html>

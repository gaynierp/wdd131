<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Open Graph (Facebook, LinkedIn, etc.) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Put Page Title Here" />
    <meta property="og:description" content="Put Page Description Here" />
    <meta property="og:url" content="https://yourURLofPage.here" />
    <meta
      property="og:image"
      content="https://yourURLofSocialPreviewImageHere.png"
    />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Put Page Title Here" />
    <meta name="twitter:description" content="Put Page Description Here" />
    <meta
      name="twitter:image"
      content="https://yourURLofSocialPreviewImageHere.png"
    />

    <!-- One favicon (ICO works everywhere) -->
    <link rel="icon" href="/favicon.ico" />

    <!-- One Apple Touch Icon (iOS home screen) -->
    <link rel="apple-touch-icon" href="/images/apple-touch-icon.png" />
    <title>Document</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="character.js" defer></script>
  </head>
  <body>
    <section class="card">
      <img
        class="image"
        src="https://external-content.duckduckgo.com/iu/?u=https%3A%2F%2Fi.pinimg.com%2Foriginals%2F28%2F85%2Fee%2F2885ee8e17f042949cc8d49cb4c78898.jpg&f=1&nofb=1&ipt=bd728dc80058e06e142a7ca9be052e1e204054a7b84ca96b62f15cfe8bf9c90c&ipo=images"
        alt="Character picture"
      />
      <div class="info">
        <div class="name"><p></p></div>
        <div class="stats"><p></p></div>
      </div>
      <div class="buttons">
        <button id="attack" value="Attack">Attack</button>
        <button id="levelUp" value="Level Up">Level Up</button>
      </div>
    </section>
  </body>
</html>
